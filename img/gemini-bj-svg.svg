<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- 카지노 펠트 방사형 그라디언트 -->
    <radialGradient id="felt-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#felt-bg)" />

  <!-- 카지노 테이블 반원 라인 & 서킷 그리드 -->
  <g stroke="#fbbf24" stroke-opacity="0.12" stroke-width="2" fill="none">
    <ellipse cx="600" cy="180" rx="480" ry="240" stroke-dasharray="8 12" />
    <ellipse cx="600" cy="180" rx="380" ry="190" />
    <line x1="120" y1="630" x2="1080" y2="630" />
  </g>

  <!-- 메인 골드 테두리 프레임 -->
  <rect x="50" y="50" width="1100" height="530" rx="32" fill="none" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.35" />

  <!-- 상단 타이틀 & 뱃지 -->
  <g transform="translate(600, 130)" text-anchor="middle">
    <rect x="-85" y="-35" width="170" height="30" rx="15" fill="#047857" filter="url(#glow)" />
    <text y="-15" fill="#fbbf24" font-family="&#39;Pretendard&#39;, sans-serif" font-size="13" font-weight="900" letter-spacing="4">CASINO SERIES</text>
    <text y="42" fill="#ffffff" font-family="&#39;Pretendard&#39;, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">BLACKJACK <tspan fill="#fbbf24">AI</tspan></text>
  </g>

  <!-- 딜러 카드 영역 (상단) -->
  <g transform="translate(490, 200)">
    <!-- 딜러 오픈 카드: 6 -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect width="100" height="145" rx="10" fill="#ffffff" />
      <text x="14" y="32" font-family="&#39;Pretendard&#39;, sans-serif" font-size="20" font-weight="900" fill="#1e293b">6</text>
      <text x="50" y="90" font-size="38" text-anchor="middle" fill="#1e293b">♠</text>
    </g>
    <!-- 딜러 히든 카드 -->
    <g transform="translate(120, 0)" filter="url(#card-shadow)">
      <rect width="100" height="145" rx="10" fill="#1e3a8a" stroke="#ffffff" stroke-width="3" />
      <rect x="15" y="15" width="70" height="115" rx="6" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 4" />
    </g>
    <!-- 딜러 약점 태그 -->
    <rect x="15" y="155" width="190" height="22" rx="11" fill="rgba(0,0,0,0.5)" />
    <text x="110" y="170" fill="#fcd34d" font-family="&#39;Pretendard&#39;, sans-serif" font-size="11" font-weight="800" text-anchor="middle">DEALER WEAK (BUST RISK)</text>
  </g>

  <!-- 플레이어 카드 영역 (하단: 블랙잭 21 완성 패) -->
  <g transform="translate(450, 395)">
    <!-- 카드 1: A -->
    <g transform="translate(0, -25) rotate(-6)" filter="url(#card-shadow)">
      <rect width="130" height="190" rx="12" fill="#ffffff" stroke="#fbbf24" stroke-width="2" />
      <text x="18" y="38" font-family="&#39;Pretendard&#39;, sans-serif" font-size="26" font-weight="900" fill="#1e293b">A</text>
      <text x="65" y="115" font-size="52" text-anchor="middle" fill="#1e293b">♠</text>
    </g>
    <!-- 카드 2: K (레드) -->
    <g transform="translate(130, -10) rotate(8)" filter="url(#card-shadow)">
      <rect width="130" height="190" rx="12" fill="#ffffff" stroke="#fbbf24" stroke-width="2" />
      <text x="18" y="38" font-family="&#39;Pretendard&#39;, sans-serif" font-size="26" font-weight="900" fill="#ef4444">K</text>
      <text x="65" y="115" font-size="52" text-anchor="middle" fill="#ef4444">♥</text>
    </g>
    <!-- AI 추천 전략 뱃지 -->
    <g transform="translate(290, 45)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#10b981" filter="url(#glow)" />
      <text x="90" y="26" fill="#ffffff" font-family="&#39;Pretendard&#39;, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="1">✨ AI: STAND (21)</text>
    </g>
  </g>

  <!-- 하단 서브 카피 -->
  <text x="600" y="540" fill="#6ee7b7" font-family="&#39;Pretendard&#39;, sans-serif" font-size="17" font-weight="600" text-anchor="middle" letter-spacing="1">
    Real-Time Basic Strategy & Odds Simulator
  </text>
</svg>