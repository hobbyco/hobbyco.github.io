<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="vp-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0055ff" />
      <stop offset="100%" stop-color="#001858" />
    </radialGradient>
    
    <!-- 100% 호환되는 순수 스페이드(♠) 벡터 심볼 정의 -->
    <g id="spade-icon">
      <path d="M 0,-24 C -14,-6 -24,4 -24,14 C -24,24 -15,30 -5,30 C 0,30 3,28 6,24 C 4,28 1,38 7,42 L -7,42 L -7,46 L 7,46 L 7,42 C 13,38 10,28 8,24 C 11,28 14,30 19,30 C 29,30 38,24 38,14 C 38,4 28,-6 14,-24 Z" fill="#1e293b" transform="scale(0.8) translate(-7, 0)" />
    </g>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#vp-bg)" />
  
  <!-- 배경 그리드 & 서킷 라인 -->
  <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="2">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="510" x2="1200" y2="510" />
    <circle cx="600" cy="315" r="280" fill="none" stroke="#fbbf24" stroke-opacity="0.2" stroke-dasharray="10 15" />
  </g>

  <!-- 메인 골드 테두리 프레임 -->
  <rect x="50" y="50" width="1100" height="530" rx="32" fill="none" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.4" />

  <!-- 타이틀 & 뱃지 -->
  <g transform="translate(600, 130)" text-anchor="middle">
    <rect x="-90" y="-35" width="180" height="30" rx="15" fill="#1e40af" />
    <text y="-15" fill="#fbbf24" font-family="&#39;Noto Sans KR&#39;, sans-serif" font-size="14" font-weight="900" letter-spacing="4">CASINO SERIES</text>
    <text y="40" fill="#ffffff" font-family="&#39;Noto Sans KR&#39;, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">VIDEO POKER <tspan fill="#fbbf24">AI</tspan></text>
  </g>

  <!-- 5장의 카드 (Royal Flush 10-J-Q-K-A) -->
  <g transform="translate(190, 240)">
    
    <!-- 1번 카드: 10 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="8" width="140" height="210" rx="14" fill="#000000" opacity="0.4" />
      <rect width="140" height="210" rx="14" fill="#ffffff" />
      <text x="16" y="44" font-family="sans-serif" font-size="28" font-weight="900" fill="#1e293b">10</text>
      <use href="#spade-icon" x="70" y="115" />
    </g>

    <!-- 2번 카드: J (HOLD) -->
    <g transform="translate(170, -18)">
      <rect x="0" y="8" width="140" height="210" rx="14" fill="#000000" opacity="0.4" />
      <rect width="140" height="210" rx="14" fill="#ffffff" stroke="#fbbf24" stroke-width="3" />
      <rect x="35" y="-14" width="70" height="24" rx="6" fill="#10b981" />
      <text x="70" y="2" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">AI HOLD</text>
      <text x="22" y="44" font-family="sans-serif" font-size="28" font-weight="900" fill="#1e293b">J</text>
      <use href="#spade-icon" x="70" y="115" />
    </g>

    <!-- 3번 카드: Q (HOLD) -->
    <g transform="translate(340, -18)">
      <rect x="0" y="8" width="140" height="210" rx="14" fill="#000000" opacity="0.4" />
      <rect width="140" height="210" rx="14" fill="#ffffff" stroke="#fbbf24" stroke-width="3" />
      <rect x="35" y="-14" width="70" height="24" rx="6" fill="#10b981" />
      <text x="70" y="2" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">AI HOLD</text>
      <text x="22" y="44" font-family="sans-serif" font-size="28" font-weight="900" fill="#1e293b">Q</text>
      <use href="#spade-icon" x="70" y="115" />
    </g>

    <!-- 4번 카드: K (HOLD) -->
    <g transform="translate(510, -18)">
      <rect x="0" y="8" width="140" height="210" rx="14" fill="#000000" opacity="0.4" />
      <rect width="140" height="210" rx="14" fill="#ffffff" stroke="#fbbf24" stroke-width="3" />
      <rect x="35" y="-14" width="70" height="24" rx="6" fill="#10b981" />
      <text x="70" y="2" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">AI HOLD</text>
      <text x="22" y="44" font-family="sans-serif" font-size="28" font-weight="900" fill="#1e293b">K</text>
      <use href="#spade-icon" x="70" y="115" />
    </g>

    <!-- 5번 카드: A -->
    <g transform="translate(680, 0)">
      <rect x="0" y="8" width="140" height="210" rx="14" fill="#000000" opacity="0.4" />
      <rect width="140" height="210" rx="14" fill="#ffffff" />
      <text x="22" y="44" font-family="sans-serif" font-size="28" font-weight="900" fill="#1e293b">A</text>
      <use href="#spade-icon" x="70" y="115" />
    </g>

  </g>

  <!-- 하단 서브 문구 -->
  <text x="600" y="530" fill="#93c5fd" font-family="&#39;Noto Sans KR&#39;, sans-serif" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="1">
    Optimal Jacks or Better Strategy Simulator
  </text>
</svg>