<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0055ff" />
      <stop offset="100%" stop-color="#001858" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)" />
  
  <!-- AI 디지털 서킷 & 그리드 라인 -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="510" x2="1200" y2="510" />
    <circle cx="600" cy="315" r="280" fill="none" stroke="#fbbf24" stroke-opacity="0.15" stroke-dasharray="10 15" />
  </g>

  <!-- 메인 골드 테두리 프레임 -->
  <rect x="50" y="50" width="1100" height="530" rx="32" fill="none" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.35" />

  <!-- 타이틀 & 뱃지 -->
  <g transform="translate(600, 130)" text-anchor="middle">
    <rect x="-90" y="-35" width="180" height="30" rx="15" fill="#1e40af" filter="url(#glow)" />
    <text y="-15" fill="#fbbf24" font-family="&#39;Pretendard&#39;, sans-serif" font-size="14" font-weight="900" letter-spacing="4">CASINO SERIES</text>
    <text y="40" fill="#ffffff" font-family="&#39;Pretendard&#39;, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">VIDEO POKER <tspan fill="#fbbf24">AI</tspan></text>
  </g>

  <!-- 5장의 카드 (Royal Flush) -->
  <g transform="translate(190, 240)">
    <!-- Card 1: 10 -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="140" height="210" rx="14" fill="#ffffff" />
      <text x="20" y="45" font-family="&#39;Pretendard&#39;, sans-serif" font-size="28" font-weight="900" fill="#1e293b">10</text>
      <text x="70" y="130" font-size="54" text-anchor="middle" fill="#1e293b">♠</text>
    </g>
    <!-- Card 2: J (HELD 추천) -->
    <g transform="translate(170, -18)" filter="url(#shadow)">
      <rect width="140" height="210" rx="14" fill="#ffffff" stroke="#fbbf24" stroke-width="3" />
      <rect x="35" y="-14" width="70" height="24" rx="6" fill="#10b981" />
      <text x="70" y="2" font-family="&#39;Pretendard&#39;, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">AI HOLD</text>
      <text x="20" y="45" font-family="&#39;Pretendard&#39;, sans-serif" font-size="28" font-weight="900" fill="#1e293b">J</text>
      <text x="70" y="130" font-size="54" text-anchor="middle" fill="#1e293b">♠</text>
    </g>
    <!-- Card 3: Q (HELD 추천) -->
    <g transform="translate(340, -18)" filter="url(#shadow)">
      <rect width="140" height="210" rx="14" fill="#ffffff" stroke="#fbbf24" stroke-width="3" />
      <rect x="35" y="-14" width="70" height="24" rx="6" fill="#10b981" />
      <text x="70" y="2" font-family="&#39;Pretendard&#39;, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">AI HOLD</text>
      <text x="20" y="45" font-family="&#39;Pretendard&#39;, sans-serif" font-size="28" font-weight="900" fill="#1e293b">Q</text>
      <text x="70" y="130" font-size="54" text-anchor="middle" fill="#1e293b">♠</text>
    </g>
    <!-- Card 4: K (HELD 추천) -->
    <g transform="translate(510, -18)" filter="url(#shadow)">
      <rect width="140" height="210" rx="14" fill="#ffffff" stroke="#fbbf24" stroke-width="3" />
      <rect x="35" y="-14" width="70" height="24" rx="6" fill="#10b981" />
      <text x="70" y="2" font-family="&#39;Pretendard&#39;, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">AI HOLD</text>
      <text x="20" y="45" font-family="&#39;Pretendard&#39;, sans-serif" font-size="28" font-weight="900" fill="#1e293b">K</text>
      <text x="70" y="130" font-size="54" text-anchor="middle" fill="#1e293b">♠</text>
    </g>
    <!-- Card 5: A -->
    <g transform="translate(680, 0)" filter="url(#shadow)">
      <rect width="140" height="210" rx="14" fill="#ffffff" />
      <text x="20" y="45" font-family="&#39;Pretendard&#39;, sans-serif" font-size="28" font-weight="900" fill="#1e293b">A</text>
      <text x="70" y="130" font-size="54" text-anchor="middle" fill="#1e293b">♠</text>
    </g>
  </g>

  <!-- 하단 서브 카피 -->
  <text x="600" y="530" fill="#93c5fd" font-family="&#39;Pretendard&#39;, sans-serif" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="1">
    Optimal Jacks or Better Strategy Simulator
  </text>
</svg>